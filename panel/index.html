<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders · Golpo Solpo</title><style>:root{--ink:#21142e;--bg:#f5f1fb;--plum:#341d4f;--gold:#ceaa64;--line:#e8e1ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:25px 18px}.brand{background:var(--plum);color:white;padding:16px 20px;font:bold 18px Georgia;letter-spacing:.4px}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand small{display:block;font:10px system-ui;color:#d5c6e2;letter-spacing:1.4px}.brand-back{flex:none;color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:999px;padding:8px 12px;font:600 12px system-ui;transition:background .2s,transform .2s}.brand-back:hover{background:#ffffff20;transform:translateX(-2px)}.brand-back:focus-visible{outline:2px solid #ceaa64;outline-offset:2px}.top{display:flex;justify-content:space-between;align-items:end;margin:25px 0 17px}.top h1{font:500 30px Georgia;margin:3px 0}.muted{color:#81788d;font-size:12px}.btn{background:#4d2d6d;color:white;border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.box{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px}.stat span{font-size:12px;color:#81788d}.stat b{display:block;font-size:25px}.title{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.row{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid #f0edf3}.row:last-child{border:0}.pill{display:inline-block;padding:5px 9px;background:#f2edf7;border-radius:20px;font-size:11px;font-weight:700}.New{background:#fff1d8;color:#87560d}.Preparing{background:#eeeafd;color:#57479b}.Ready{background:#e6f5e7;color:#326f43}.Served{background:#eee;color:#666}.empty{text-align:center;padding:40px;color:#81788d}.login{max-width:390px;margin:9vh auto;background:white;padding:24px;border:1px solid var(--line);border-radius:14px}.login h2{font:500 24px Georgia;margin:0 0 10px}input{padding:11px;border:1px solid var(--line);border-radius:8px;width:100%;margin:10px 0}.login .btn{width:100%}.err{color:#a33;font-size:12px}@media(max-width:650px){.wrap{padding:16px 12px 84px}.brand{padding:12px}.brand-row{align-items:flex-start;gap:8px}.brand-back{padding:9px 10px;min-height:40px;white-space:nowrap}.top{align-items:flex-start;flex-wrap:wrap;gap:10px}.top h1{font-size:25px}.top>.btn{width:100%;min-height:44px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{padding:10px}.stat b{font-size:21px}.row{grid-template-columns:1fr 1fr;gap:8px;padding:13px}.row>div:nth-child(3){grid-column:1/-1}.row>div:last-child{grid-column:1/-1}.row .btn{width:100%;min-height:44px;white-space:normal}.title{gap:8px;flex-wrap:wrap}.login{margin:8vh 12px;max-width:none}.login input{font-size:16px;min-height:44px}.music-toggle{right:10px;bottom:10px}}
.music-toggle{position:fixed;right:16px;bottom:16px;z-index:9999;isolation:isolate;overflow:hidden;border:1px solid #60a5fa;border-radius:999px;background-color:#000;color:#fff;padding:10px 14px;font:600 12px system-ui;box-shadow:0 5px 20px #1d4ed844;cursor:pointer;background-image:radial-gradient(ellipse at 18% 100%,#1d4ed8 0%,transparent 48%),radial-gradient(ellipse at 88% 0%,#60a5fa 0%,transparent 42%),linear-gradient(130deg,#000 0%,#07142e 38%,#000 100%);background-size:180% 180%,180% 180%,220% 220%;background-position:0% 50%,100% 50%,0% 50%;animation:liquidFlow 7s ease-in-out infinite}.music-toggle:hover{filter:brightness(1.18);animation-duration:2.4s}.music-toggle:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}.music-toggle.playing{animation:musicPulse 1.7s ease-in-out infinite,liquidFlow 2.6s ease-in-out infinite}.music-toggle.playing::after{content:" ♪";display:inline-block;animation:musicNote .7s ease-in-out infinite alternate}@keyframes liquidFlow{0%,100%{background-position:0% 50%,100% 50%,0% 50%}50%{background-position:100% 50%,0% 50%,100% 50%}}@keyframes musicPulse{0%,100%{box-shadow:0 5px 20px #1d4ed844;transform:scale(1)}50%{box-shadow:0 7px 28px #1d4ed888;transform:scale(1.035)}}@keyframes musicNote{from{transform:translateY(1px) rotate(-10deg)}to{transform:translateY(-2px) rotate(10deg)}}@media(prefers-reduced-motion:reduce){.music-toggle,.music-toggle.playing,.music-toggle.playing::after{animation:none}}

.gs-page-transition{position:fixed;inset:0;z-index:2147483647;display:flex;overflow:hidden;pointer-events:none}.gs-page-transition__column{height:100%;flex:1;background:#000;will-change:transform}@media(prefers-reduced-motion:reduce){.gs-page-transition{display:none!important}}

.gs-page-transition__loader{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:#fff}
.gs-morph-loading{position:relative;width:120px;height:120px}
.gs-morph-loading span{position:absolute;left:calc(50% - 8px);top:calc(50% - 8px);width:16px;height:16px;background:#fff;animation-duration:2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.gs-morph-loading span:nth-child(1){animation-name:gs-morph-0}
.gs-morph-loading span:nth-child(2){animation-name:gs-morph-1;animation-delay:.2s}
.gs-morph-loading span:nth-child(3){animation-name:gs-morph-2;animation-delay:.4s}
.gs-morph-loading span:nth-child(4){animation-name:gs-morph-3;animation-delay:.6s}
@keyframes gs-morph-0{0%,100%{transform:translate(0,0) scale(1);border-radius:0}25%{transform:translate(20px,-20px) scale(1.2);border-radius:50%}50%{transform:translate(40px,0) scale(.8);border-radius:25%}75%{transform:translate(20px,20px) scale(1.1);border-radius:75%}}
@keyframes gs-morph-1{0%,100%{transform:translate(0,0) scale(1) rotate(0);border-radius:0}25%{transform:translate(-20px,-20px) scale(1.3) rotate(90deg);border-radius:50%}50%{transform:translate(-40px,0) scale(.7) rotate(180deg);border-radius:25%}75%{transform:translate(-20px,20px) scale(1.2) rotate(270deg);border-radius:75%}}
@keyframes gs-morph-2{0%,100%{transform:translate(0,0) scale(1);border-radius:0}25%{transform:translate(-20px,20px) scale(.9);border-radius:100%}50%{transform:translate(0,40px) scale(1.4);border-radius:0}75%{transform:translate(20px,20px) scale(.8);border-radius:50%}}
@keyframes gs-morph-3{0%,100%{transform:translate(0,0) scale(1) rotate(0);border-radius:0}25%{transform:translate(20px,20px) scale(1.1) rotate(-90deg);border-radius:25%}50%{transform:translate(0,-40px) scale(1.3) rotate(-180deg);border-radius:100%}75%{transform:translate(-20px,-20px) scale(.9) rotate(-270deg);border-radius:75%}}
@media(prefers-reduced-motion:reduce){.gs-page-transition__loader{display:none!important}.gs-morph-loading span{animation:none!important}}
</style></head><body>
<button class="music-toggle" id="gsMusic" type="button" aria-pressed="false">♫ Play music</button><audio id="gsAudio" src="/music.mp3" preload="none" loop></audio><div class="brand"><div class="brand-row"><div>Golpo Solpo<small>RESTAURANT ORDER DESK · BAMANGRAM</small></div><a class="brand-back" href="/#home" aria-label="Go back to the Golpo Solpo homepage">← Back to website</a></div></div><main id="app"></main><script>
let pin=sessionStorage.getItem('gs-admin-pin')||'';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function login(err=''){document.querySelector('#app').innerHTML=`<div class="login"><h2>Order panel</h2><p class="muted">Enter your private panel PIN.</p><input id="pin" type="password" placeholder="Panel PIN" autocomplete="current-password"><button class="btn" onclick="auth()">Open order desk</button><div class="err">${err}</div></div>`;document.querySelector('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')auth()})}async function auth(){pin=document.querySelector('#pin').value;sessionStorage.setItem('gs-admin-pin',pin);await load()}async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json','x-admin-pin':pin}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function rupee(n){return '₹'+Number(n).toLocaleString('en-IN')}async function load(){try{let orders=await api('/api/orders');panel(orders)}catch(e){if(e.message.includes('PIN')){sessionStorage.removeItem('gs-admin-pin');pin='';login('Incorrect PIN. Please try again.')}else document.querySelector('#app').innerHTML=`<div class="wrap"><p>${esc(e.message)}</p><button class="btn" onclick="load()">Retry</button></div>`}}function panel(os){let active=os.filter(o=>o.status!=='Served').length,fresh=os.filter(o=>o.status==='New').length;document.querySelector('#app').innerHTML=`<div class="wrap"><div class="top"><div><div class="muted">BAMANGRAM · WEST BENGAL · OPEN DAILY 10 AM–10 PM</div><h1>Incoming orders</h1><span class="muted">Refreshes automatically every 4 seconds</span></div><button class="btn" onclick="load()">↻ Refresh</button></div><div class="stats"><div class="stat"><span>Active</span><b>${active}</b></div><div class="stat"><span>New</span><b>${fresh}</b></div><div class="stat"><span>Orders today</span><b>${os.length}</b></div></div><section class="box"><div class="title"><b>Kitchen queue</b><span class="muted">Order updates live</span></div>${os.length?os.map(o=>`<div class="row"><div><b>${esc(o.id)}</b><div class="muted">${new Date(o.createdAt).toLocaleString('en-IN')}</div></div><div><span class="pill">Table ${o.table}</span><div style="margin-top:7px"><span class="pill ${o.status}">${o.status}</span></div></div><div>${o.items.map(i=>`<div><b>${i.qty}×</b> ${esc(i.name)}</div>`).join('')}<b style="display:block;margin-top:5px">${rupee(o.items.reduce((a,i)=>a+i.qty*i.price,0))}</b></div><div>${o.status==='New'?`<button class="btn" onclick="advance('${esc(o.id)}','Preparing')">Start preparing →</button>`:o.status==='Preparing'?`<button class="btn" onclick="advance('${esc(o.id)}','Ready')">Mark ready →</button>`:o.status==='Ready'?`<button class="btn" onclick="advance('${esc(o.id)}','Served')">Mark served ✓</button>`:'<span class="muted">Complete</span>'}</div></div>`).join(''):'<div class="empty">No orders yet. Customer orders will appear here.</div>'}</section></div>`}async function advance(id,status){try{await api('/api/orders',{method:'PATCH',body:JSON.stringify({id,status})});await load()}catch(e){alert(e.message)}}login();setInterval(()=>{if(pin)load()},4000);
</script>
<script>(()=>{const audio=document.getElementById('gsAudio'),btn=document.getElementById('gsMusic'),KEY='gs-music';let optedOut=false;try{optedOut=localStorage.getItem(KEY)==='off'}catch(e){}function label(){const on=!audio.paused;btn.textContent=on?'♫ Music on · turn off':'♫ Play music';btn.classList.toggle('playing',on);btn.setAttribute('aria-pressed',String(on))}let audioCtx=null;function enhanceAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx){audioCtx=new AC();const src=audioCtx.createMediaElementSource(audio);const low=audioCtx.createBiquadFilter();low.type='highpass';low.frequency.value=70;const presence=audioCtx.createBiquadFilter();presence.type='peaking';presence.frequency.value=3200;presence.Q.value=0.85;presence.gain.value=2.2;const air=audioCtx.createBiquadFilter();air.type='highshelf';air.frequency.value=7200;air.gain.value=2.5;const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-25;comp.knee.value=12;comp.ratio.value=1.7;comp.attack.value=.008;comp.release.value=.18;src.connect(low);low.connect(presence);presence.connect(air);air.connect(comp);comp.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){audioCtx=null}}async function play(){if(optedOut)return;audio.volume=.42;enhanceAudio();try{await audio.play();label()}catch(e){label()}}function toggle(){if(!audio.paused){audio.pause();optedOut=true;try{localStorage.setItem(KEY,'off')}catch(e){}label()}else{optedOut=false;try{localStorage.removeItem(KEY)}catch(e){}play()}}btn.addEventListener('click',toggle);document.addEventListener('pointerdown',e=>{if(!e.target.closest('#gsMusic'))play()},{once:true});document.addEventListener('keydown',play,{once:true});audio.addEventListener('play',label);audio.addEventListener('pause',label);label()})();</script>
<script>
(()=>{
 const KEY="gs-stairs-route-pending";let routeBusy=false;
 const reduced=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};
 function build(arrival){
  const stage=document.createElement("div");stage.className="gs-page-transition";stage.setAttribute("aria-hidden","false");
  const cols=[];
  for(let i=0;i<5;i++){
   const c=document.createElement("div");c.className="gs-page-transition__column";
   c.style.transform=arrival?"translateY(0%)":(i%2===0?"translateY(-100%)":"translateY(100%)");
   stage.appendChild(c);cols.push(c);
  }
  stage.insertAdjacentHTML("beforeend",'<div class="gs-page-transition__loader" role="status" aria-label="Loading page"><div class="gs-morph-loading" aria-hidden="true"><span></span><span></span><span></span><span></span></div></div>');
  document.body.appendChild(stage);return{stage,cols};
 }
 function animate(cols,enter){
  const jobs=cols.map((c,i)=>{
   const from=enter?(i%2===0?"translateY(-100%)":"translateY(100%)"):"translateY(0%)";
   const to=enter?"translateY(0%)":(i%2===0?"translateY(-100%)":"translateY(100%)");
   if(!c.animate)return Promise.resolve();
   return c.animate([{transform:from},{transform:to}],{duration:700,delay:i*50,easing:"cubic-bezier(.76,0,.24,1)",fill:"forwards"}).finished.catch(()=>{});
  });
  return Promise.all(jobs);
 }
 function navigate(e){
  const a=e.target.closest&&e.target.closest("a[href]");if(!a)return;
  const target=a.id==="gsOrderCta"||a.classList.contains("back-site")||a.classList.contains("brand-back");
  if(!target)return;
  if(routeBusy){e.preventDefault();return}
  if(reduced()||!Element.prototype.animate)return;
  e.preventDefault();routeBusy=true;const href=a.href;
  try{sessionStorage.setItem(KEY,"1")}catch(x){}
  const {cols}=build(false);let sent=false;
  const go=()=>{if(sent)return;sent=true;location.assign(href)};
  animate(cols,true).then(go);setTimeout(go,1250);setTimeout(()=>{routeBusy=false},5000);
 }
 function arrive(){
  let pending=false;try{pending=sessionStorage.getItem(KEY)==="1";sessionStorage.removeItem(KEY)}catch(e){}
  if(!pending||reduced())return;
  const {stage,cols}=build(true);let done=false;
  const reveal=()=>{if(done)return;done=true;animate(cols,false).then(()=>stage.remove());};
  window.addEventListener("load",reveal,{once:true});setTimeout(reveal,1800);
 }
 // Carry table QR context back to the site homepage and its order CTA.
 const table=new URLSearchParams(location.search).get("table");
 const returnTo=table&&/^(?:[1-9]|1[0-2])$/.test(table)?"/?table="+table+"#home":"/#home";
 document.querySelectorAll(".back-site,.brand-back").forEach(a=>a.setAttribute("href",returnTo));
 document.addEventListener("click",navigate,true);arrive();
})();
</script>
