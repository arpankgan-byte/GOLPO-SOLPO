<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order · Golpo Solpo</title><style>:root{--ink:#21142e;--bg:#f5f1fb;--plum:#341d4f;--gold:#ceaa64;--line:#e8e1ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Arial}.wrap{max-width:960px;margin:auto;padding:22px}.head{background:var(--plum);color:white;border-radius:15px;padding:23px;margin-bottom:18px}.head h1{font:500 32px Georgia,serif;margin:0}.head p{margin:6px 0 0;color:#dfd4e9}.kicker{font-size:10px;letter-spacing:1.4px;color:#e3c781}.cols{display:grid;grid-template-columns:1fr 300px;gap:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dish,.cart{background:white;border:1px solid var(--line);border-radius:12px;padding:15px}.dish{display:flex;justify-content:space-between;align-items:center;gap:12px}.dish h3{font-size:14px;margin:0}.dish p{font-size:11px;color:#83798b;margin:5px 0}.price{font-weight:750}.btn{background:#4d2d6d;color:white;border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.cart{align-self:start}.cart h2{margin:0 0 12px;font-size:17px}select{padding:9px;border:1px solid var(--line);border-radius:7px;background:white}.row{display:flex;justify-content:space-between;padding:9px 0;font-size:12px}.qty{display:flex;align-items:center;gap:7px}.qty button{border:0;border-radius:5px;background:#f2edf7;padding:3px 8px}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;font-weight:750}.msg{background:#e9f6e9;color:#27633b;padding:11px;border-radius:8px;margin-bottom:12px;display:none}.empty{color:#847a8e;padding:17px 0;text-align:center}.under{text-align:center;color:#82788c;font-size:11px;margin-top:15px}@media(max-width:700px){.wrap{padding:14px}.cols{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.cart{order:-1}.head h1{font-size:27px}}</style></head><body><main class="wrap"><header class="head"><div class="kicker">BAMANGRAM · WEST BENGAL · OPEN DAILY 10 AM–10 PM</div><h1>Good food, good golpo.</h1><p>Pick your dishes — our kitchen will receive your order.</p></header><div class="msg" id="msg"></div><div class="cols"><section><h2 style="font:500 22px Georgia;margin:0 0 12px">The menu</h2><div class="grid" id="menu"></div></section><aside class="cart"><h2>Your order</h2><label for="table">Table number</label><br><select id="table" style="margin:8px 0 10px;width:100%"></select><div id="items"></div><div class="total"><span>Total</span><span id="total">₹0</span></div><button class="btn" id="submit" style="width:100%;margin-top:13px" disabled onclick="submitOrder()">Send order to kitchen →</button><p class="under">Your order goes directly to Golpo Solpo.</p></aside></div></main><script>
const menu=[{id:1,name:'Chicken Pakora',price:180},{id:2,name:'Chicken Kosha',price:180},{id:3,name:'Chicken Tandoori (Half)',price:300},{id:4,name:'Chilli Paneer',price:180},{id:5,name:'Lachha Chicken Roll',price:120},{id:6,name:'Chai & Milk Coffee',price:50},{id:7,name:'Mutton Biryani',price:300},{id:8,name:'Chicken Tandoori (Full)',price:500}];let cart={};const rupee=n=>'₹'+Number(n).toLocaleString('en-IN');const table=document.querySelector('#table');table.innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">Table ${i+1}</option>`).join('');let param=new URLSearchParams(location.search).get('table');if(param&&Number(param)>=1&&Number(param)<=12)table.value=param;document.querySelector('#menu').innerHTML=menu.map(m=>`<article class="dish"><div><h3>${m.name}</h3><p>Freshly prepared at Golpo Solpo</p><span class="price">${rupee(m.price)}</span></div><button class="btn" onclick="change(${m.id},1)">+</button></article>`).join('');function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];paint()}function paint(){let arr=Object.entries(cart).filter(x=>x[1]);document.querySelector('#items').innerHTML=arr.length?arr.map(([id,q])=>{let m=menu.find(x=>x.id===+id);return `<div class="row"><span>${m.name}<br>${rupee(m.price*q)}</span><span class="qty"><button onclick="change(${id},-1)">−</button>${q}<button onclick="change(${id},1)">+</button></span></div>`}).join(''):'<div class="empty">Your cart is empty.</div>';document.querySelector('#total').textContent=rupee(menu.reduce((a,m)=>a+m.price*(cart[m.id]||0),0));document.querySelector('#submit').disabled=!arr.length}async function submitOrder(){let b=document.querySelector('#submit');b.disabled=true;b.textContent='Sending…';try{let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table:+table.value,items:Object.entries(cart).map(([menuId,qty])=>({menuId:+menuId,qty}))})}),d=await r.json();if(!r.ok)throw Error(d.error||'Please try again');cart={};paint();let m=document.querySelector('#msg');m.textContent=`Order received! Reference ${d.id}. The kitchen has your order.`;m.style.display='block';window.scrollTo({top:0,behavior:'smooth'})}catch(e){alert(e.message)}finally{b.textContent='Send order to kitchen →';b.disabled=!Object.values(cart).some(Boolean)}}paint();
</script></body></html>
