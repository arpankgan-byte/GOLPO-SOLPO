<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order · Golpo Solpo</title><style>:root{--ink:#21142e;--bg:#f5f1fb;--plum:#341d4f;--gold:#ceaa64;--line:#e8e1ef;--muted:#81788d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Arial}.wrap{max-width:1120px;margin:auto;padding:20px}.head{background:var(--plum);color:white;border-radius:15px;padding:23px;margin-bottom:18px}.head h1{font:500 32px Georgia,serif;margin:0}.head p{margin:6px 0 0;color:#dfd4e9}.kicker{font-size:10px;letter-spacing:1.4px;color:#e3c781}.layout{display:grid;grid-template-columns:1fr 310px;gap:16px;align-items:start}.menu-head{display:flex;justify-content:space-between;align-items:end}.menu-head h2{font:500 23px Georgia;margin:0 0 12px}.muted{color:var(--muted);font-size:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.tab{border:1px solid var(--line);border-radius:99px;background:#fff;color:#584769;padding:8px 12px;cursor:pointer;font:600 12px system-ui}.tab.active{background:var(--plum);color:white;border-color:var(--plum)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.dish,.cart{background:white;border:1px solid var(--line);border-radius:12px;padding:14px}.dish{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:86px}.dish h3{font-size:13px;margin:0}.dish .cat{font-size:10px;color:var(--muted);margin-top:4px}.price{font-weight:750;margin-top:5px;display:block}.btn{background:#4d2d6d;color:white;border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;white-space:nowrap}.btn:disabled{opacity:.5}.cart{position:sticky;top:14px}.cart h2{margin:0 0 12px;font-size:17px}select{padding:9px;border:1px solid var(--line);border-radius:7px;background:white}.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;font-size:12px;border-bottom:1px solid #f3eff7}.qty{display:flex;align-items:center;gap:7px;white-space:nowrap}.qty button{border:0;border-radius:5px;background:#f2edf7;padding:3px 8px;cursor:pointer}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:8px;font-weight:750}.msg{background:#e9f6e9;color:#27633b;padding:11px;border-radius:8px;margin-bottom:12px;display:none}.empty{color:var(--muted);padding:17px 0;text-align:center}.under{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}.error{color:#a33}@media(max-width:760px){.wrap{padding:13px}.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.cart{position:static;order:-1}.head h1{font-size:27px}}
.music-toggle{position:fixed;right:16px;bottom:16px;z-index:9999;border:1px solid #ffffff55;border-radius:999px;background:#341d4f;color:#fff;padding:10px 14px;font:600 12px system-ui;box-shadow:0 5px 20px #180d2a44;cursor:pointer}.music-toggle:hover{background:#4d2d6d}.music-toggle:focus-visible{outline:3px solid #ceaa64;outline-offset:2px}.music-toggle.playing{animation:musicPulse 1.7s ease-in-out infinite}.music-toggle.playing::after{content:" ♪";display:inline-block;animation:musicNote .7s ease-in-out infinite alternate}@keyframes musicPulse{0%,100%{box-shadow:0 5px 20px #180d2a44;transform:scale(1)}50%{box-shadow:0 7px 26px #8b5fc688;transform:scale(1.035)}}@keyframes musicNote{from{transform:translateY(1px) rotate(-10deg)}to{transform:translateY(-2px) rotate(10deg)}}@media(prefers-reduced-motion:reduce){.music-toggle.playing,.music-toggle.playing::after{animation:none}}
</style></head><body>
<button class="music-toggle" id="gsMusic" type="button" aria-pressed="false">♫ Play music</button><audio id="gsAudio" src="/music.mp3" preload="none" loop></audio><main class="wrap"><header class="head"><div class="kicker">BAMANGRAM · WEST BENGAL · OPEN DAILY 10 AM–10 PM</div><h1>Good food, good golpo.</h1><p>Browse our full menu and send your order straight to the kitchen.</p></header><div class="msg" id="msg"></div><div class="layout"><section><div class="menu-head"><h2>Our full menu</h2><span class="muted" id="count">52 dishes · prices in ₹</span></div><nav class="tabs" id="tabs" aria-label="Menu categories"></nav><div class="grid" id="menu"></div></section><aside class="cart"><h2>Your order</h2><label for="table">Table number</label><select id="table" style="margin:8px 0 10px;width:100%"></select><div id="items"></div><div class="total"><span>Total</span><span id="total">₹0</span></div><button class="btn" id="submit" style="width:100%;margin-top:13px" disabled onclick="submitOrder()">Send order to kitchen →</button><p class="under">Your order goes directly to Golpo Solpo.</p></aside></div></main><script>
let menu=[],cart={},category='All';const rupee=n=>'₹'+Number(n).toLocaleString('en-IN');const table=document.querySelector('#table');table.innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">Table ${i+1}</option>`).join('');const param=new URLSearchParams(location.search).get('table');if(param&&Number(param)>=1&&Number(param)<=12)table.value=param;async function init(){try{const r=await fetch('/menu.json',{cache:'no-store'});if(!r.ok)throw Error('Could not load the restaurant menu');menu=await r.json();drawTabs();drawMenu()}catch(e){document.querySelector('#menu').innerHTML=`<p class="error">${e.message}</p>`}}function drawTabs(){const cats=['All',...new Set(menu.map(x=>x.category))];document.querySelector('#tabs').innerHTML=cats.map(c=>`<button class="tab ${c===category?'active':''}" onclick="setCategory(${JSON.stringify(c).replaceAll('"','&quot;')})">${c}</button>`).join('')}function setCategory(c){category=c;drawTabs();drawMenu()}function drawMenu(){const list=category==='All'?menu:menu.filter(m=>m.category===category);document.querySelector('#count').textContent=`${list.length} dishes · prices in ₹`;document.querySelector('#menu').innerHTML=list.map(m=>`<article class="dish"><div><h3>${m.name}</h3><div class="cat">${m.category}</div><span class="price">${rupee(m.price)}</span></div><button class="btn" onclick="change(${m.id},1)" aria-label="Add ${m.name}">Add +</button></article>`).join('')}function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];paint()}function paint(){const arr=Object.entries(cart).filter(x=>x[1]);document.querySelector('#items').innerHTML=arr.length?arr.map(([id,q])=>{const m=menu.find(x=>x.id===+id);return `<div class="row"><span>${m.name}<br><span class="muted">${rupee(m.price*q)}</span></span><span class="qty"><button onclick="change(${id},-1)">−</button>${q}<button onclick="change(${id},1)">+</button></span></div>`}).join(''):'<div class="empty">Your cart is empty.</div>';document.querySelector('#total').textContent=rupee(menu.reduce((a,m)=>a+m.price*(cart[m.id]||0),0));document.querySelector('#submit').disabled=!arr.length}async function submitOrder(){const b=document.querySelector('#submit');b.disabled=true;b.textContent='Sending…';try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table:+table.value,items:Object.entries(cart).map(([menuId,qty])=>({menuId:+menuId,qty}))})}),d=await r.json();if(!r.ok)throw Error(d.error||'Please try again');cart={};paint();const m=document.querySelector('#msg');m.textContent=`Order received! Reference ${d.id}. The kitchen has your order.`;m.style.display='block';window.scrollTo({top:0,behavior:'smooth'})}catch(e){alert(e.message)}finally{b.textContent='Send order to kitchen →';b.disabled=!Object.values(cart).some(Boolean)}}init().then(paint);
</script>
<script>(()=>{const audio=document.getElementById('gsAudio'),btn=document.getElementById('gsMusic'),KEY='gs-music';let optedOut=false;try{optedOut=localStorage.getItem(KEY)==='off'}catch(e){}function label(){const on=!audio.paused;btn.textContent=on?'♫ Music on · turn off':'♫ Play music';btn.classList.toggle('playing',on);btn.setAttribute('aria-pressed',String(on))}let audioCtx=null;function enhanceAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx){audioCtx=new AC();const src=audioCtx.createMediaElementSource(audio);const low=audioCtx.createBiquadFilter();low.type='highpass';low.frequency.value=70;const presence=audioCtx.createBiquadFilter();presence.type='peaking';presence.frequency.value=3200;presence.Q.value=0.85;presence.gain.value=2.2;const air=audioCtx.createBiquadFilter();air.type='highshelf';air.frequency.value=7200;air.gain.value=2.5;const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-25;comp.knee.value=12;comp.ratio.value=1.7;comp.attack.value=.008;comp.release.value=.18;src.connect(low);low.connect(presence);presence.connect(air);air.connect(comp);comp.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){audioCtx=null}}async function play(){if(optedOut)return;audio.volume=.42;enhanceAudio();try{await audio.play();label()}catch(e){label()}}function toggle(){if(!audio.paused){audio.pause();optedOut=true;try{localStorage.setItem(KEY,'off')}catch(e){}label()}else{optedOut=false;try{localStorage.removeItem(KEY)}catch(e){}play()}}btn.addEventListener('click',toggle);document.addEventListener('pointerdown',e=>{if(!e.target.closest('#gsMusic'))play()},{once:true});document.addEventListener('keydown',play,{once:true});audio.addEventListener('play',label);audio.addEventListener('pause',label);label()})();</script>
</body></html>
