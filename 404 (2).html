    :root{color-scheme:light;--ink:#222;--black:#000;--muted:#777;--ghost:#eceff3}

    .primary:hover{background:#000;transform:scale(1.04)}.primary:focus-visible,.more summary:focus-visible{outline:3px solid #777;outline-offset:4px}
    .more{margin:44px auto 0;max-width:570px;color:#555;font-size:14px;animation:rise-in .6s cubic-bezier(.43,.13,.23,.96) .4s both}
    .more summary{display:inline-block;cursor:pointer;text-decoration:underline;text-underline-offset:4px;opacity:.68}.more p{margin:12px 0 0;color:#555}
    .more a{color:#222;font-weight:600;text-underline-offset:3px}.small-links{margin-top:10px;font-size:13px}
    @keyframes rise-in{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @keyframes digit-in{from{opacity:0;transform:translate(calc(var(--direction)*40px),15px) rotate(calc(var(--direction)*5deg))}to{opacity:.7;transform:translate(0,0) rotate(0)}}
    @keyframes ghost-in{from{opacity:0;transform:scale(.8) translateY(15px) rotate(-5deg)}to{opacity:1;transform:scale(1) translateY(0) rotate(0)}}
    @keyframes ghost-float{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
    @keyframes ghost-hover{from{transform:translateY(-8px) scale(1.05) rotate(-4deg)}to{transform:translateY(-8px) scale(1.05) rotate(4deg)}}

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

          e.preventDefault();try{parent.postMessage({gs:1,href:h},'*')}catch(_){ }
        }
      },true);
    })();
  </script>
</body>
